# Single source of truth for resampling, tuning and the compute budget.
# Closes action item 4.
#
# Consumed by R/config.R. Nothing else may hardcode these numbers.
#
# ---------------------------------------------------------------------------
# 2026-08-17: THE TUNING DESIGN IS NO LONGER A REPRODUCTION OF THE ORIGINAL.
#
# Deliberate decision [HUGH]. The original search space was audited element by
# element and found to be almost entirely inert - it tuned preprocessing that
# cannot affect the learners, and tuned no learner hyperparameters at all. See
# finding 7.23. Reproducing it faithfully would mean reproducing a design we had
# already decided to replace, at roughly 900 CPU-hours.
#
# What is still reproduced: the analysis SHAPE - per site, per predictor stack,
# the same five learner slots, spatial cross-validation, and the same benchmark
# structure. What is not: the preprocessing graph and the hyperparameters.
#
# The probabilistic/conformal treatment is explicitly deferred to the next
# refactor; predict_type = "prob" below is the foundation it will need.
# ---------------------------------------------------------------------------

seed: 5446   # covers tuning and final resampling. NOTE: the balanced class
             # sampling in the extract scripts calls sample() unseeded, so exact
             # training sets are unrecoverable. Reproduction targets statistical
             # equivalence, not bit-identity.

tuning:
  resampling: spcv_coords
  # 5, not the original's 20. Inner resampling only has to rank configurations
  # against each other, not produce a publishable estimate - that is the outer
  # loop's job. 20 folds on 82-222 observations means ~4-11 observations per
  # fold, which is noise dressed up as precision, and it cost 4x for nothing.
  folds: 5
  repeats: 1
  # Model-based (Bayesian) optimisation via mlr3mbo. Decision 2026-08-18 [HUGH].
  # Pleasingly, this makes the manuscript's section 2.5 claim of "Bayesian
  # optimisation" TRUE - finding 1.4 records that the original only ever ran
  # random search, with tnr("mbo") appearing in a demo script. The methods text
  # no longer needs correcting on this point.
  tuner: mbo
  # 30, not 50: MBO spends its budget adaptively, and ~30 evaluations of a 4-6
  # dimensional space typically matches or beats 50 random draws. Finding 1.8:
  # the original's budget was never stated anywhere.
  term_evals: 30

final:
  resampling: repeated_spcv_coords
  folds: 10
  repeats: 10
  # 10 x 10 = 100 iterations. The manuscript says "200-iteration spatial block
  # cross-validation" in section 2.5, section 2.6 and the Fig 4 and 6 captions.
  # 200 appears nowhere in any repository. Finding 1.1.
  iterations: 100

# Finding 1.2: spcv_coords is k-means clustering of coordinates (Brenning 2012),
# NOT blocking. The manuscript's "spatial block cross-validation" wording most
# likely came from spatial-autocorrelation.Rmd, which is the only file in any
# repository using spcv_block and is a teaching notebook, not the pipeline.
# Section 5.1 recommends promoting a real block CV to a pipeline target so the
# claim can either be substantiated or corrected.
block_cv:
  enabled: false          # set true to run the R1 spatial-block comparison
  resampling: spcv_block
  folds: 4
  range: null             # metres. Derive from legacy_imported/variogram/
                          # rather than guessing. Required if enabled.

# WHAT WAS REMOVED FROM THE SEARCH SPACE, AND WHY (finding 7.23)
#
#   scale / no.scale branch  - ranger and xgboost split on thresholds and are
#                              invariant to monotone per-feature transforms;
#                              classif.svm leaves `scale` unset so e1071 already
#                              standardises internally. Inert for every learner.
#   pca / nop branch         - po("pca") defaults to rank. = NULL, keeping ALL
#                              components: a centred orthogonal rotation, not
#                              reduction. Distance-preserving, so inert for
#                              linear and RBF SVM; for trees it perturbs splits
#                              with no principled benefit and destroys feature
#                              importance, which we want to report.
#   importance filter        - filter.frac is the fraction KEPT; at 0.1 it keeps
#                              ONE feature of 6 or 11. With deliberately chosen
#                              bands there is nothing to select away, and the
#                              filter trained an extra ranger per evaluation.
#   svm tolerance            - the optimiser's stopping criterion, not a capacity
#                              parameter. Tuning it buys numerical noise.
#
# Net effect: the old space doubled and redoubled itself over choices that could
# not change the fitted model, which is why the untuned baseline matched every
# tuned learner, and why the tuning archive showed sd 0.068 across configurations
# that were largely equivalent by construction.

learners:
  - id: xgboost
    backend: classif.xgboost
    tuned: true
    # Custom compact space (R/models.R), replacing classif.xgboost.default whose
    # nrounds ranged to ~2000: on 82-222 observations that made xgboost the run's
    # only long tail - 28 fits still open after 7h while every other learner had
    # finished. Capped at 500 with the core capacity parameters kept.
    tuning_space: xgboost_trimmed
  - id: svm
    backend: classif.svm
    tuned: true
    tuning_space: svm_trimmed               # rbv2 minus tolerance; see R/models.R
    type: C-classification
  - id: ranger
    backend: classif.ranger
    tuned: true
    tuning_space: classif.ranger.default     # mtry.ratio, num.trees, replace,
                                             # sample.fraction
  - id: lightgbm
    backend: classif.lightgbm            # via mlr3extralearners (pinned, 9.7)
    tuned: true
    tuning_space: lightgbm_custom        # no lts space exists for lightgbm
    # Added 2026-08-18 [HUGH]. Generally as accurate as xgboost and much faster.
    # Project precedent: Glen already trialled classif.lightgbm in
    # Development_test/run_choices_lightgbm.R. catboost considered and deferred:
    # not on CRAN, installs from a GitHub release binary, and uvr already failed
    # to resolve its repo layout once (9.7) - one non-CRAN dependency is enough.
  - id: ensemble
    backend: stacked
    tuned: false
    # Stacking is a real modelling choice and is kept. Base learners are left at
    # defaults: tuning inside each learner_cv inside each outer fold multiplies
    # cost without a clear claim attached to it.
    # Finding 4.9: in the original, ens_rf wrapped the SVM learner and ens_svm
    # wrapped ranger. Cosmetic, but learner_id output was misleading. Fixed here.
  - id: ranger_untuned
    backend: classif.ranger
    tuned: false
    role: baseline
    # Kept, and now genuinely informative: with a search space that has real
    # leverage, a tuned learner that cannot beat this is telling us something.

# Action item 3, and the foundation for the conformal work deferred to the next
# refactor. Retain BOTH hard and probability outputs everywhere; the original
# never set this.
predict_type: prob

profile:
  # A 'fast' pass must exercise the whole graph end to end on reduced budgets
  # before any real compute is committed.
  fast:
    term_evals: 5
    tuning_folds: 3
    final_folds: 3
    final_repeats: 1
    sites: [bokspits_1]
  full:
    term_evals: 50
    tuning_folds: 5
    final_folds: 10
    final_repeats: 10
    sites: all

# Landscape prediction (R/predict.R). One classified surface per site, produced
# by the winning learner for the configured stack, retrained on all of that
# site's training data with its tuned configuration.
prediction:
  # 5_CHM_ALLVI matches the archived landscape products
  # (svm_pixel_level_*_stack_5_CHM_ALLVI.tif), keeping our surfaces directly
  # comparable with the originals and with Table S10. Our marginally best stack
  # is 5_CHM_NDVI (+0.004); comparability wins at that margin.
  stack: 5_CHM_ALLVI
  # Both outputs always: hard classes for the maps and area figures, per-class
  # probabilities as the foundation for the conformal work (next refactor).
  write_prob: true
  # The fast profile predicts on an aggregated cube (factor 20 ~ 1.1 m pixels)
  # so the graph is exercised end to end in seconds, not tens of minutes.
  fast_aggregate: 20
